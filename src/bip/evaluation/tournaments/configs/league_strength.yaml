# League strength multipliers — Shelopugin (2023) Glicko-2 grounded.
#
# Reference league: Premier League (multiplier = 1.0, glicko_rating = 2118.8).
# Other leagues scaled relative via:
#
#     multiplier = exp(α · (rating − 2118.8))   with α = 0.001/Glicko-pt
#
# (See `bip.evaluation.tournaments.data.league_strength` module docstring
# for the empirical α derivation against the operator's pre-Phase-4 table.)
#
# `glicko_rating` carries Shelopugin Table V (Europe) / Table VI (South
# America) values directly. Leagues outside his sample (MLS, Saudi, J1, K1,
# Süper Lig, Greek, Belgian Pro) leave it null and rely on operator-tuned
# multipliers; their `confidence` field flags how much to trust each value.
#
# Confidence levels:
#   high   -- Shelopugin Table V/VI rating + operator validation
#   medium -- Shelopugin OR operator (one source)
#   low    -- placeholder; revisit post-WC2026 backtest
#
# Adding a league: pick its API-Football league_id from /leagues. If it
# appears in Shelopugin Table V/VI, set `glicko_rating` and let the
# `multiplier` derive from `derive_multiplier_from_glicko()` (or override
# explicitly with a justified note). Otherwise set `glicko_rating: null`
# and tune `multiplier` from operator domain knowledge / Club Elo proxy.

leagues:
